<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 230">
  <title>HTML-first document review workflow</title>
  <defs><marker id="workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#225e83"/></marker></defs>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-size="17">
    <rect x="10" y="55" width="180" height="80" rx="9" fill="#edf5f9" stroke="#9dbbd0"/><text x="100" y="88">Markdown source</text><text x="100" y="113" font-size="13">and SVG diagrams</text>
    <rect x="225" y="55" width="180" height="80" rx="9" fill="#edf5f9" stroke="#9dbbd0"/><text x="315" y="88">Token-based build</text><text x="315" y="113" font-size="13">preserve structure</text>
    <rect x="440" y="55" width="180" height="80" rx="9" fill="#193f59"/><text x="530" y="88" fill="white">Offline HTML</text><text x="530" y="113" fill="white" font-size="13">priorities and navigation</text>
