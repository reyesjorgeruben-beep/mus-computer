  </g>
  <g fill="none" stroke="#225e83" stroke-width="2" marker-end="url(#workflow-arrow)"><path d="M190 95H222"/><path d="M405 95H437"/><path d="M620 95H652"/><path d="M835 95H867"/><path d="M960 140V195H100V140"/></g>
